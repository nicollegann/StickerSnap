# .github/workflows/deploy.yml
#
# StickerSnap CD
# ==============
# develop → Continuous Deployment: auto-deploys dev Lambda on CI pass
# main    → Continuous Delivery:   deploys prod Lambda after manual approval
#
# The frontend is managed entirely by Vercel via its GitHub integration.
# This workflow only handles the AWS backend (ECR image + Lambda updates).
#
# One-time setup:
#   1. Run `cdk deploy`
#   2. Add the repo secrets below to Settings → Secrets and variables → Actions:
#        AWS_DEPLOY_ROLE_ARN     — GitHubActionsRoleArn CDK output
#        AWS_REGION              — e.g. ap-southeast-1
#        ECR_REPOSITORY_URI      — ECR repo URI from AWS Console or CDK output
#        LAMBDA_DEV_FUNCTION_NAME — StickerSnapDevLambdaFunctionName CDK output
#        LAMBDA_PROD_FUNCTION_NAME — StickerSnapLambdaFunctionName CDK output

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["production", "main"]
    types: [completed]

permissions:
  id-token: write # Required for OIDC auth to AWS
  contents: read

jobs:
  # ── Shared: build & push Docker image ───────────────────────────────────────
  # Runs for both branches. Both Lambdas use the same image; env vars in the
  # Lambda config point them at different S3 buckets and quota namespaces.
  build-image:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      image-tag: ${{ steps.build.outputs.image-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: build
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          ECR_URI: ${{ secrets.ECR_REPOSITORY_URI }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ECR_URI:$IMAGE_TAG \
            -t $ECR_URI:latest \
            ./lambda
          docker push $ECR_URI:$IMAGE_TAG
          docker push $ECR_URI:latest
          echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ── Dev: auto-deploy (Continuous Deployment) ────────────────────────────────
  # Runs automatically on every develop push that passes CI.
  # No approval needed — broken dev deploys are expected and easy to roll back.
  deploy-dev:
    name: Deploy dev Lambda
    runs-on: ubuntu-latest
    needs: build-image
    if: ${{ github.event.workflow_run.head_branch == 'main' }}
    environment: development

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update dev Lambda
        env:
          IMAGE_TAG: ${{ needs.build-image.outputs.image-tag }}
          ECR_URI: ${{ secrets.ECR_REPOSITORY_URI }}
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_DEV_FUNCTION_NAME }} \
            --image-uri $ECR_URI:$IMAGE_TAG

      - name: Wait for update to complete
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_DEV_FUNCTION_NAME }}

  # ── Prod: manual approval gate (Continuous Delivery) ────────────────────────
  # The `environment: production` line pauses execution here and sends an
  # approval request to the reviewers configured on that environment.
  # The Docker image is already in ECR by the time you approve, so the
  # actual Lambda update after approval takes ~30 seconds.
  deploy-prod:
    name: Deploy prod Lambda
    runs-on: ubuntu-latest
    needs: build-image
    if: ${{ github.event.workflow_run.head_branch == 'production' }}
    environment: production # pauses here; requires manual approval

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update prod Lambda
        env:
          IMAGE_TAG: ${{ needs.build-image.outputs.image-tag }}
          ECR_URI: ${{ secrets.ECR_REPOSITORY_URI }}
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_PROD_FUNCTION_NAME }} \
            --image-uri $ECR_URI:$IMAGE_TAG

      - name: Wait for update to complete
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_PROD_FUNCTION_NAME }}
