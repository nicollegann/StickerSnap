# .github/workflows/ci.yml
#
# StickerSnap CI
# ==============
# Runs on every push and pull request.
# Two parallel jobs:
#   backend  — pytest on the Lambda handler (Python 3.12, moto, rembg mocked)
#   frontend — vitest on the React app (Node 20, jsdom)
#
# Both jobs must pass before a PR can be merged (enforce via branch protection).

name: CI

on:
  push:
    branches: ["production", "main"]
  pull_request:
    branches: ["production", "main"]

# Cancel in-flight runs for the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend tests (Python)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lambda # adjust if your handler lives elsewhere

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lambda/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the full runtime deps so handler.py can be imported,
          # plus test-only deps (moto, pytest-cov).
          pip install -r requirements.txt -r requirements-test.txt

      # rembg downloads a ~170 MB model on first run; we mock remove() in tests
      # so the model is never downloaded in CI — no extra step needed.

      - name: Run tests with coverage
        env:
          # Suppress Numba/LLVM JIT compiler noise in CI logs
          NUMBA_DISABLE_JIT: "1"
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=handler \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: lambda/coverage.xml
          retention-days: 14

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend tests (Node / Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck --if-present

      - name: Run tests with coverage
        run: |
          npm test -- \
            --reporter=verbose \
            --coverage \
            --coverage.reporter=text \
            --coverage.reporter=lcov \
            --coverage.thresholds.lines=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/lcov.info
          retention-days: 14

  # ── Summary gate ─────────────────────────────────────────────────────────────
  # A single status check that branch protection can key off.
  all-checks-pass:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.backend.result }}" != "success" || \
                "${{ needs.frontend.result }}" != "success" ]]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All jobs succeeded."
